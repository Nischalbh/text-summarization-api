
services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: summarization-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
